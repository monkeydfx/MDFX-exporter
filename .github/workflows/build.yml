name: Build Release

on:
  push:
    tags:
      - 'MDFX-Exporter'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build-cmd: npm run build:win
            artifact: TFX-Sync.exe
          - os: macos-latest
            build-cmd: npm run build:mac
            artifact: TFX-Sync-1.0.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: ${{ matrix.build-cmd }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
