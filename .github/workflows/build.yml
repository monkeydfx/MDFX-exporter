name: Build Release

on:
  push:
    branches:
      - develop
    tags:
      - 'MDFX-Exporter'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build:win
      - name: Generate latest.yml
        run: |
          node -e "
            const fs=require('fs');
            const crypto=require('crypto');
            const pkg=require('./package.json');
            const buf=fs.readFileSync('dist/TFX-Sync.exe');
            const sha512=crypto.createHash('sha512').update(buf).digest('base64');
            const yml=[
              'version: '+pkg.version,
              'files:',
              '  - url: TFX-Sync.exe',
              '    sha512: '+sha512,
              '    size: '+buf.length,
              'path: TFX-Sync.exe',
              'sha512: '+sha512,
              'releaseDate: \''+new Date().toISOString()+'\'',
            ].join('\n');
            fs.writeFileSync('dist/latest.yml',yml);
            console.log('Generated latest.yml for v'+pkg.version);
          "
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: MDFX-Exporter
          files: |
            dist/TFX-Sync.exe
            dist/latest.yml
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build:mac
      - name: Generate latest-mac.yml
        run: |
          node -e "
            const fs=require('fs');
            const crypto=require('crypto');
            const pkg=require('./package.json');
            const buf=fs.readFileSync('dist/TFX-Sync-1.0.dmg');
            const sha512=crypto.createHash('sha512').update(buf).digest('base64');
            const yml=[
              'version: '+pkg.version,
              'files:',
              '  - url: TFX-Sync-1.0.dmg',
              '    sha512: '+sha512,
              '    size: '+buf.length,
              'path: TFX-Sync-1.0.dmg',
              'sha512: '+sha512,
              'releaseDate: \''+new Date().toISOString()+'\'',
            ].join('\n');
            fs.writeFileSync('dist/latest-mac.yml',yml);
            console.log('Generated latest-mac.yml for v'+pkg.version);
          "
      - name: Check artifacts
        run: ls -la dist/
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: MDFX-Exporter
          files: |
            dist/TFX-Sync-1.0.dmg
            dist/latest-mac.yml
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
